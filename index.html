<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyst Adventure</title>
  <meta name="description" content="Juego 2D para aprender planillas de cálculo: de pasante a analista de datos senior.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Menú principal -->
    <section id="screen-title" class="screen">
      <canvas id="menu-bg" aria-hidden="true"></canvas>
      <div class="menu-vignette" aria-hidden="true"></div>
      <div class="menu-layout">
        <header class="menu-title">
          <h1><span class="logo-cell">=</span><span class="logo-text">ANALYST ADVENTURE</span></h1>
          <p class="tagline" id="menu-tagline"></p>
        </header>
        <div id="menu-content" class="menu-content"></div>
      </div>
      <footer class="menu-foot" id="menu-foot"></footer>
    </section>

    <!-- Oficina -->
    <section id="screen-office" class="screen">
      <canvas id="office-canvas"></canvas>
      <div class="hud hud-right">
        <button class="btn btn-sm" id="hud-notebook"></button>
        <button class="btn btn-sm" id="hud-career"></button>
        <button class="btn btn-sm" id="hud-menu" aria-label="Menú">☰</button>
      </div>
      <div class="hud hud-bottom" id="hud-help"></div>
      <div id="dialog" class="dialog hidden"></div>
    </section>

    <!-- Computadora: bandeja de entrada -->
    <section id="screen-computer" class="screen"></section>

    <!-- Planilla de la misión -->
    <section id="screen-mission" class="screen"></section>

    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Motor -->
  <script src="js/engine/formula.js"></script>
  <script src="js/engine/sheet.js"></script>
  <script src="js/i18n/i18n.js"></script>
  <!-- Sistema -->
  <script src="js/game/storage.js"></script>
  <script src="js/game/settings.js"></script>
  <script src="js/game/audio.js"></script>
  <script src="js/game/state.js"></script>
  <!-- Interfaz -->
  <script src="js/ui/grid.js"></script>
  <script src="js/ui/common.js"></script>
  <!-- Contenido -->
  <script src="js/game/validators.js"></script>
  <script src="js/charts/chart-model.js"></script>
  <script src="js/charts/chart-builder.js"></script>
  <script src="js/tools/pivot.js"></script>
  <script src="js/tools/sql.js"></script>
  <script src="js/tools/sql-console.js"></script>
  <script src="js/tools/dashboard.js"></script>
  <script src="js/tools/report.js"></script>
  <script src="js/game/workspace.js"></script>
  <script src="js/game/content/lib.js"></script>
  <script src="js/game/content/mod1.js"></script>
  <script src="js/game/content/mod2.js"></script>
  <script src="js/game/content/mod3.js"></script>
  <script src="js/game/content/mod4.js"></script>
  <script src="js/game/content/mod5.js"></script>
  <script src="js/game/content/mod6.js"></script>
  <script src="js/game/content/mod7.js"></script>
  <script src="js/game/content/mod8.js"></script>
  <script src="js/game/content/mod9.js"></script>
  <script src="js/game/content/mod10.js"></script>
  <script src="js/game/content/mod11.js"></script>
  <script src="js/game/content/mod12.js"></script>
  <script src="js/game/content/mod13.js"></script>
  <script src="js/game/content/mod14.js"></script>
  <script src="js/game/content/mod15.js"></script>
  <script src="js/game/content/mod16.js"></script>
  <script src="js/game/content/mod17.js"></script>
  <script src="js/game/content/mod18.js"></script>
  <script src="js/game/content/mod19.js"></script>
  <script src="js/game/content/curriculum.js"></script>
  <!-- Juego -->
  <script src="js/game/sprites.js"></script>
  <script src="js/game/dialog.js"></script>
  <script src="js/game/office.js"></script>
  <script src="js/game/story.js"></script>
  <script src="js/game/screens.js"></script>
  <script src="js/ui/menu-bg.js"></script>
  <script src="js/ui/creator.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
